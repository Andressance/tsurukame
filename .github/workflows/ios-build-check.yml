name: iOS build check
on:
  push:
    branches: [ci/ios-build-check]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      # Unsigned simulator build; also builds the embedded ReviewLiveActivity extension.
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Tsurukame.xcworkspace -scheme Tsurukame \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build.log | tail -n 60
      - name: Surface errors as annotations
        if: failure()
        working-directory: ios
        run: grep -E "error:|\*\* BUILD FAILED|Command .* failed" build.log | sort -u | head -30 | while read -r l; do echo "::error::${l:0:600}"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ios/build.log
